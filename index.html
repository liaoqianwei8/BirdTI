<html lang="zh-CN">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F7FA 50%, #B3E5FC 100%);
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        
        /* 开始页面 */
        .start-page {
            text-align: center;
            padding: 30px 20px;
        }
        
        .start-page h1 {
            font-size: 2.5rem;
            color: #1E88E5;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .start-page .subtitle {
            color: #546E7A;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .bird-icon {
            font-size: 80px;
            margin: 30px 0;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .btn {
            background: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.5);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #1E88E5, #42A5F5);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        /* 问题页面 */
        .question-page {
            display: none;
        }
        
        .question-box {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .question-number {
            color: #1E88E5;
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 1.3rem;
            color: #37474F;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option-btn {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            border: 2px solid transparent;
            padding: 15px 20px;
            border-radius: 15px;
            text-align: left;
            font-size: 1rem;
            color: #37474F;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option-btn:hover {
            border-color: #1E88E5;
            background: rgba(30, 136, 229, 0.1);
            transform: translateX(5px);
        }
        
        .option-btn.selected {
            border-color: #1E88E5;
            background: rgba(30, 136, 229, 0.15);
        }
        
        /* 结果页面 */
        .result-page {
            display: none;
            text-align: center;
        }
        
        .result-card {
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .result-badge {
            background: linear-gradient(135deg, #FFD54F 0%, #FFC107 100%);
            color: #E65100;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .bird-image {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        .bird-image:hover {
            transform: scale(1.1);
        }
        
        .result-title {
            font-size: 2rem;
            color: #1E88E5;
            margin-bottom: 10px;
        }
        
        .result-keyword {
            color: #546E7A;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .result-description {
            color: #455A64;
            line-height: 1.7;
            margin-bottom: 25px;
            text-align: left;
        }
        
        /* 科普信息 */
        .info-section {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .info-section h3 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .info-section p {
            color: #388E3C;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        
        .info-section p:last-child {
            margin-bottom: 0;
        }
        
        .mbti-type {
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.05);
            padding: 3px 8px;
            border-radius: 5px;
        }

        .share-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .start-page h1 {
                font-size: 2rem;
            }

                padding: 20px;
            }
            
            .bird-image {
                font-size: 100px;
            }
        }
    </style>
</head>

        let currentQuestion = 0;

        function startQuiz() {
            document.getElementById('startPage').style.display = 'none';
            document.getElementById('questionPage').style.display = 'block';
            showQuestion();
        }
        
        function showQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `问题 ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('questionText').textContent = question.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = String.fromCharCode(65 + index) + '. ' + option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });
            
            updateProgress();
        }
        
        function selectOption(type) {
            answers.push(type);
            
            // 清除所有选中状态
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            
            // 添加选中状态
            event.target.classList.add('selected');
            
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 500);
        }
        
        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        function calculateMBTI() {
            const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            
            answers.forEach(type => {
                counts[type]++;
            });
            
            const EorI = counts.E >= counts.I ? 'E' : 'I';
            const SorN = counts.S >= counts.N ? 'S' : 'N';
            const TorF = counts.T >= counts.F ? 'T' : 'F';
            const JorP = counts.J >= counts.P ? 'J' : 'P';
            
            return EorI + SorN + TorF + JorP;
        }
        
        function showResult() {
            const mbti = calculateMBTI();

            document.getElementById('questionPage').style.display = 'none';

            document.getElementById('birdName').textContent = bird.name;
            document.getElementById('birdKeyword').textContent = bird.keyword;

                const text = `我在BirdTI小鸟性格测试中测出了${bird.name}！${bird.title}，关键词：${bird.keyword}来测测你的小鸟人格吧！`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'BirdTI小鸟性格测试',
                        text: text,
                        url: window.location.href
                    });
                } else {
                    // 复制到剪贴板
                    navigator.clipboard.writeText(text + '\n' + window.location.href);
                    alert('结果已复制到剪贴板，快去分享吧！');
                }
            }
        }
    </script>
