        }
        
        @keyframes bounce {

        }

            background: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);

        }

        }
        
        .btn:active {
            transform: translateY(0);

            border-radius: 15px;
            text-align: left;

</head>

        let currentQuestion = 0;
        let answers = [];
        
        function startQuiz() {
            document.getElementById('startPage').style.display = 'none';
            document.getElementById('questionPage').style.display = 'block';
            showQuestion();
        }
        
        function showQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `问题 ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('questionText').textContent = question.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = String.fromCharCode(65 + index) + '. ' + option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });
            
            updateProgress();
        }
        
        function selectOption(type) {
            answers.push(type);
            
            // 清除所有选中状态
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            
            // 添加选中状态
            event.target.classList.add('selected');
            
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 500);
        }
        
        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        function calculateMBTI() {
            const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            
            answers.forEach(type => {
                counts[type]++;
            });
            
            const EorI = counts.E >= counts.I ? 'E' : 'I';
            const SorN = counts.S >= counts.N ? 'S' : 'N';
            const TorF = counts.T >= counts.F ? 'T' : 'F';
            const JorP = counts.J >= counts.P ? 'J' : 'P';
            
            return EorI + SorN + TorF + JorP;
        }
        
        function showResult() {
            const mbti = calculateMBTI();
            const bird = birdTypes[mbti] || birdTypes.INFJ;
            
            document.getElementById('questionPage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'block';
            
            document.getElementById('birdImage').src = bird.image;
            document.getElementById('birdName').textContent = bird.name;
            document.getElementById('birdKeyword').textContent = bird.keyword;
            document.getElementById('birdDescription').textContent = bird.description;
            
            // 显示科普信息
            const infoSection = document.getElementById('birdInfo');
            infoSection.innerHTML = `
                <h3>🐦 小鸟科普</h3>
                <p><strong>外貌特征：</strong>${bird.info.appearance}</p>
                <p><strong>生活习性：</strong>${bird.info.habit}</p>
                <p><strong>栖息地：</strong>${bird.info.habitat}</p>
            `;
            
            // 保存结果到本地存储，方便分享
            localStorage.setItem('birdtiResult', JSON.stringify({ mbti, bird }));
        }
        
        function restartQuiz() {
            currentQuestion = 0;
            answers = [];
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('startPage').style.display = 'block';
        }
        
        function shareResult() {
            const result = localStorage.getItem('birdtiResult');
            if (result) {
                const { bird } = JSON.parse(result);
                const text = `我在BirdTI小鸟性格测试中测出了${bird.name}！${bird.title}，关键词：${bird.keyword}来测测你的小鸟人格吧！`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'BirdTI小鸟性格测试',
                        text: text,
                        url: window.location.href
                    });
                } else {
                    // 复制到剪贴板
                    navigator.clipboard.writeText(text + '\n' + window.location.href);
                    alert('结果已复制到剪贴板，快去分享吧！');
                }
            }
        }
