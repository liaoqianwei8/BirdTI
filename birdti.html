                image: "https://neeko-copilot.bytedance.net/api/text2image?prompt=super%20cute%20chibi%20woodpecker%20bird%20red%20crest%20black%20white%20body%20cartoon%20kawaii%20style%20big%20round%20eyes%20on%20tree%20trunk%20forest%20background&model=dall-e-3",
                appearance: "啄木鸟体型中等，头部红色（雄鸟），背部黑白相间，腹部白色。喙坚硬而尖锐，适合敲击树木。",
                habits: "以树木中的昆虫为食，用坚硬的喙敲击树干寻找猎物。筑巢于树洞中，是森林的医生。",
                habitat: "分布于森林和园林中，在有树木的地方都能见到。对森林生态系统非常有益。"
            },
            kingfisher: {
                name: "翠鸟",
                icon: "🐦",
                title: "优雅猎手",
                keywords: ["优雅", "精准", "专注", "追求完美"],
                description: "你就像一只优雅的翠鸟！气质高雅，做事精准专注。你追求完美，每一个动作都充满优雅和力量。",
                image: "https://neeko-copilot.bytedance.net/api/text2image?prompt=super%20cute%20chibi%20kingfisher%20bird%20bright%20blue%20feathers%20orange%20chest%20cartoon%20kawaii%20style%20big%20round%20eyes%20by%20water%20river%20background&model=dall-e-3",
                appearance: "翠鸟体型小巧，羽毛色彩鲜艳，背部和翅膀呈翠蓝色，腹部橙红色。喙长而尖锐，适合捕鱼。",
                habits: "擅长捕鱼，常常站在水边的树枝上等待猎物，然后迅速俯冲入水捕捉。叫声清脆响亮。",
                habitat: "喜欢在河流、湖泊、池塘等水域附近活动，栖息在树枝或岩石上。"
            },
            owl: {
                name: "猫头鹰",
                icon: "🦉",
                title: "智慧学者",
                keywords: ["睿智", "冷静", "深度思考", "洞察力"],
                description: "你就像一只神秘的猫头鹰！喜欢独自思考，有着敏锐的洞察力和深邃的智慧。你善于分析问题，总能看到事物的本质。",
                image: "https://neeko-copilot.bytedance.net/api/text2image?prompt=super%20cute%20chibi%20owl%20bird%20big%20round%20eyes%20fluffy%20brown%20feathers%20cartoon%20kawaii%20style%20wise%20mysterious%20night%20moon%20stars%20background&model=dall-e-3",
                appearance: "猫头鹰头部宽大，眼睛大而圆，面部有面盘结构。羽毛柔软，飞行时几乎无声。喙弯曲尖锐。",
                habits: "夜行性鸟类，白天休息夜晚活动。以鼠类、昆虫等为食，听觉和视觉非常灵敏。",
                habitat: "分布广泛，从森林到城市都能见到。喜欢在树洞、建筑物缝隙中筑巢。"
            }
        };

        let currentQuestion = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        let selectedOption = null;
        let currentBirdType = null;

        function startQuiz() {
            document.getElementById('startPage').style.display = 'none';
            document.getElementById('quizPage').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `第 ${currentQuestion + 1} / ${questions.length} 题`;
            document.getElementById('questionText').textContent = question.question;
            
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}</span><span class="option-text">${option.text.substring(3)}</span>`;
                li.onclick = () => selectOption(option, li);
                optionsList.appendChild(li);
            });
            
            selectedOption = null;
            document.getElementById('nextBtn').style.display = 'none';
            updateProgress();
        }

        function selectOption(option, li) {
            document.querySelectorAll('.option-item').forEach(item => item.classList.remove('selected'));
            li.classList.add('selected');
            selectedOption = option;
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            if (selectedOption) {
                Object.keys(selectedOption.value).forEach(key => {
                    scores[key] += selectedOption.value[key];
                });
            }
            
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResult() {
            document.getElementById('quizPage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'block';
            
            const birdType = determineBirdType();
            currentBirdType = birdType;
            const bird = birdTypes[birdType];
            
            document.getElementById('birdImage').src = bird.image;
            document.getElementById('birdType').textContent = bird.name;
            document.getElementById('birdTitle').textContent = bird.title;
            
            const keywordsDiv = document.getElementById('keywords');
            keywordsDiv.innerHTML = '';
            bird.keywords.forEach(keyword => {
                const span = document.createElement('span');
                span.className = 'keyword';
                span.textContent = keyword;
                keywordsDiv.appendChild(span);
            });
            
            document.getElementById('description').textContent = bird.description;
            document.getElementById('appearance').textContent = bird.appearance;
            document.getElementById('habits').textContent = bird.habits;
            document.getElementById('habitat').textContent = bird.habitat;
        }

        function determineBirdType() {
            const E = scores.E > scores.I ? 'E' : 'I';
            const S = scores.S > scores.N ? 'S' : 'N';
            const T = scores.T > scores.F ? 'T' : 'F';
            const J = scores.J > scores.P ? 'J' : 'P';
            
            const mbti = E + S + T + J;
            
            // 根据MBTI类型映射到常见鸟类
            const mbtiToBird = {
                'ESTJ': 'woodpecker',
                'ESTP': 'magpie',
                'ESFJ': 'bulbuls',
                'ESFP': 'sparrow',
                'ENTJ': 'magpie',
                'ENTP': 'swallow',
                'ENFJ': 'bulbuls',
                'ENFP': 'swallow',
                'ISTJ': 'turtle_dove',
                'ISTP': 'kingfisher',
                'ISFJ': 'turtle_dove',
                'ISFP': 'kingfisher',
                'INTJ': 'owl',
                'INTP': 'owl',
                'INFJ': 'kingfisher',
                'INFP': 'sparrow'
            };
            
            return mbtiToBird[mbti] || 'sparrow';
        }

        function restartQuiz() {
            currentQuestion = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            selectedOption = null;
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('startPage').style.display = 'block';
        }

        function shareResult() {
            const bird = birdTypes[currentBirdType];
            const shareText = `我在BirdTI测试中测出了${bird.name}！${bird.title}：${bird.keywords.join('、')}。快来测测你是哪种小鸟吧！`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'BirdTI小鸟性格测试',
                    text: shareText,
                    url: window.location.href
                });
            } else {
                // 复制链接到剪贴板
                const fullText = shareText + '\n' + window.location.href;
                navigator.clipboard.writeText(fullText).then(() => {
                    alert('已复制到剪贴板，快去分享给朋友吧！');
                });
            }
        }
    </script>
